<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preferencias</title>
</head>
<body>
    <form action="">
        <h1>Perguntas sobre dragon ball</h1>

    <!-- Pergunta 01 - radio -->

        <h2>Qual é o nome do planeta natal de Goku?</h2>

        <input type="radio" name="Kaio-sama" id="Kaio-sama">
        <label for="Kaio-sama">Kaio-sama</label><br>

        <input type="radio" name="Vegeta" id="Vegeta">
        <label for="Vegeta">Vegeta</label>

        <br>

        <input type="radio" name="Namekusei" id="Namekusei">
        <label for="Namekusei">Namekusei</label>

        <br>

        <input type="radio" name="Terra" id="Terra">
        <label for="Terra">Terra</label>
        <br>

<!-- Pergunta 02 - chebox -->
        <h2>Quem é o criador das Esferas do Dragão (Dragon Balls)?</h2>

        <input type="checkbox" name="Kami-sama" id="Kami-sama">
        <label for="Kami-sama">Kami-sama</label><br>

        <input type="checkbox" name="Mestre Kame" id="Mestre Kame">
        <label for="Mestre Kame">Mestre Kame</label>

        <br>

        <input type="checkbox" name="Dr. Maligno" id="Dr. Maligno">
        <label for="Dr. Maligno">Dr. Maligno</label>

        <br>

        <input type="checkbox" name="Shenlong" id="Shenlong">
        <label for="Shenlong">Shenlong</label>

        <br>
        <br>
        <label for="id">Idade</label>
        <input type="number" name="idade" id="idade" style="width: 2rem; height: 1rem;">

        <br>
        <br>
        <input type="submit" name="Enviar" id="Enviar">

    </form>
</body>
</html>
